<!DOCTYPE html>
<html lang="en" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
      <!-- Favicon (cambia según el tema del navegador: negro en claro, lima en oscuro) -->
      <link rel="icon" type="image/png" href="/manifest-icons/favicon-light.png" media="(prefers-color-scheme: light)">
      <link rel="icon" type="image/png" href="/manifest-icons/favicon-dark.png" media="(prefers-color-scheme: dark)">

      <!-- Apple Touch Icon -->
      <link rel="apple-touch-icon" sizes="180x180" href="/manifest-icons/apple-touch-icon.png">

      <!-- Manifest -->
      <link rel="manifest" href="/site.webmanifest">

      <meta name="theme-color" content="#d6ff3d">

      />
