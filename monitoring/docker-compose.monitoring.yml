services:

  # ── Métricas ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: passix_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # ── Alertas → Telegram ────────────────────────────────────────────────────
  # El bot token/chat id NO van en git: se pasan como env vars (TELEGRAM_BOT_TOKEN /
  # TELEGRAM_CHAT_ID). El entrypoint los inyecta en el template con sed al arrancar.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: passix_alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Definir TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Definir TELEGRAM_CHAT_ID}
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|__BOT_TOKEN__|$${TELEGRAM_BOT_TOKEN}|" -e "s|__CHAT_ID__|$${TELEGRAM_CHAT_ID}|"
        /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - monitoring
    depends_on:
      - prometheus

  # ── Dashboards ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: passix_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.grafana.rule=Host(`grafana.getpassix.com`)
      - traefik.http.routers.grafana.entrypoints=https
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana-http.rule=Host(`grafana.getpassix.com`)
      - traefik.http.routers.grafana-http.entrypoints=http
      - traefik.http.routers.grafana-http.middlewares=grafana-redirect
      - traefik.http.middlewares.grafana-redirect.redirectscheme.scheme=https
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Definir GRAFANA_PASSWORD en Coolify}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: "https://%(domain)s/"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    networks:
      - monitoring
      - coolify
    depends_on:
      - prometheus
      - loki

  # ── Logs ──────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: passix_loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.4
    container_name: passix_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # ── Host metrics ──────────────────────────────────────────────────────────
  # pid:host + montajes /proc /sys para ver métricas reales del servidor
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: passix_node_exporter
    restart: unless-stopped
    pid: host
    networks:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # ── Métricas por container (CPU, RAM, red, reinicios) ─────────────────────
  # Provee container_last_seen / container_* que usa la alerta ContainerReiniciado
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: passix_cadvisor
    restart: unless-stopped
    privileged: true
    # cgroup v2 + cgroupns: sin el namespace del host, cAdvisor no ve los otros
    # containers (solo los system.slice). Con host resuelve los nombres (label name).
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # ── Blackbox / Health checks HTTP ─────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: passix_blackbox
    restart: unless-stopped
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

volumes:
  # external: los volúmenes ya existen en el server con datos históricos.
  # NO recrear (se perdería el histórico de Prometheus y la config de Grafana).
  prometheus_data:
    external: true
    name: passix_prometheus_data
  grafana_data:
    external: true
    name: passix_grafana_data
  loki_data:
    external: true
    name: passix_loki_data
  alertmanager_data:
    name: passix_alertmanager_data

networks:
  monitoring:
    name: passix_monitoring
    driver: bridge

  # Red del proxy de Coolify (Traefik). Grafana se une para publicarse en grafana.getpassix.com.
  coolify:
    external: true
