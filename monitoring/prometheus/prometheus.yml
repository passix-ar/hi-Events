global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: passix

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  # Prometheus se monitorea a sí mismo
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métricas del servidor host (CPU, RAM, disco, red)
  # node-exporter corre con network_mode:host → se accede por host.docker.internal
  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']

  # Health checks HTTP del sitio
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - ${APP_URL:-https://app.passix.com.ar}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
