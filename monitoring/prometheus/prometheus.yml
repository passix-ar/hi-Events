global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: passix

rule_files:
  - /etc/prometheus/alert-rules.yml

# Las alertas de alert-rules.yml se envían a Alertmanager, que las enruta a Telegram.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  # Prometheus se monitorea a sí mismo
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métricas del servidor host (CPU, RAM, disco, red)
  # node-exporter corre con pid:host + montajes /proc /sys → accesible por nombre de container
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas por contenedor (CPU, RAM, red, IO) vía Telegraf + docker-socket-proxy.
  # Reemplaza a cAdvisor, que no soporta el storage driver overlayfs de este host.
  - job_name: telegraf-docker
    static_configs:
      - targets: ['telegraf:9273']

  # Health checks HTTP del sitio (frontend) y de la API (backend)
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://app.getpassix.com]
        labels:
          service: frontend
      - targets: [https://api.getpassix.com]
        labels:
          service: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
