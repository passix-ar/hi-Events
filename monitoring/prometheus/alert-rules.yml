groups:
  - name: passix_infra
    rules:

      # Servicio HTTP caído — dispara si front o backend no responde HTTP 200 por 2 minutos
      - alert: ServicioCaido
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "🔴 {{ $labels.service }} no responde"
          description: "El servicio {{ $labels.service }} ({{ $labels.instance }}) no responde HTTP 200 hace más de 2 minutos."

      # Disco al 80%
      - alert: DiscoAlto
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Disco casi lleno"
          description: "Queda {{ $value | printf \"%.0f\" }}% de espacio libre. Limpiar logs o ampliar disco."

      # Disco al 90% — crítico
      - alert: DiscoCritico
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🔴 Disco crítico"
          description: "Queda {{ $value | printf \"%.0f\" }}% de espacio. El servidor puede fallar."

      # RAM > 90% sostenida
      - alert: RAMAlta
        expr: >
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ RAM al {{ $value | printf \"%.0f\" }}%"
          description: "El uso de memoria supera el 90% por más de 5 minutos."

      # Swap MOVIÉNDOSE — este es el síntoma que duele de verdad.
      #
      # Swap ocupada no es un problema: el kernel estaciona ahí páginas frías para
      # liberar RAM para page cache, y ese espacio queda tomado hasta que alguien
      # las necesite. Después de un deploy pesado la swap sube y se queda fija en
      # ese valor durante días sin que pase absolutamente nada. Alertar por volumen
      # es alertar por el marcador de la marea alta anterior.
      #
      # Lo que sí duele es el tráfico: si el kernel está leyendo y escribiendo swap
      # sin parar, hay procesos frenados esperando disco y la máquina se arrastra.
      #
      # Calibración (medido 2026-08-11): valor habitual 0 páginas/seg, pico 45. El
      # umbral de 200 deja ~4x de margen sobre el peor momento medido.
      #
      # OJO con el alcance de esa medición: la retención de este Prometheus es de 72h,
      # así que la ventana sólo cubre operación tranquila. Un build pesado — que es
      # justo cuando la swap se mueve en serio — quedó fuera de los datos disponibles.
      # El umbral está sin validar contra ese escenario. Si el próximo deploy grande
      # dispara esta alerta sin que la app se haya degradado, subirlo es lo correcto;
      # el `for: 15m` está puesto para que un pico corto de build no alcance a cruzarlo.
      - alert: SwapThrashing
        expr: >
          rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m]) > 200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "🔴 El servidor está paginando a disco sin parar"
          description: "Hace 15 minutos que el kernel mueve {{ $value | printf \"%.0f\" }} páginas/seg entre RAM y swap. Hay procesos esperando disco: la app está lenta. Falta RAM — revisar qué se comió la memoria o pasar a un plan más grande."

      # Backstop por volumen: si la swap se llena de verdad, la próxima asignación que
      # no entre despierta al OOM killer y se lleva puesto lo que encuentre.
      #
      # En bytes absolutos a propósito: un porcentaje dividiría por SwapTotal, que da
      # cero si algún día se desactiva el swap, y la alerta quedaría rota en silencio.
      # 1.5GB de los 2GB del servidor. Referencia: el pico de la última semana fue
      # 709MB, así que hay margen de sobra antes de que esto suene.
      - alert: SwapCasiLlena
        expr: node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes > 1610612736
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ Swap por encima de 1.5GB"
          description: "El servidor lleva 30 minutos con más de 1.5GB de swap ocupada de 2GB totales. Todavía no molesta, pero si se llena el próximo pedido de memoria lo resuelve el OOM killer. Conviene mirar antes de que pase."

      # CPU > 90% sostenida
      - alert: CPUAlta
        expr: >
          100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "⚠️ CPU al {{ $value | printf \"%.0f\" }}%"
          description: "El uso de CPU supera el 90% por más de 10 minutos."
