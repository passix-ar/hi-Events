auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# Retención: 3 días — optimización de memoria (reduce SWAP usage)
# Cambio: 360h (15 días) → 72h (3 días)
# Razón: Stack de monitoreo sin límites de memoria causaba crecimiento de SWAP
# Ver: infra/docs/MEMORY_OPTIMIZATION.md
limits_config:
  retention_period: 72h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

compactor:
  retention_enabled: true
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Ruler: evalúa reglas de alerta sobre los logs (LogQL) y las envía a Alertmanager.
# Las reglas viven en git en loki/rules/fake/ (tenant "fake" porque auth_enabled=false).
# El ring lo hereda del bloque common (inmemory). enable_api expone /loki/api/v1/rules
# (solo red interna) para verificar que las reglas cargaron tras un deploy.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true

analytics:
  reporting_enabled: false
