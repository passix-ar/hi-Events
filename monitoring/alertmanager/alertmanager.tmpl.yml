# Template de Alertmanager → Telegram (SIN secretos, versionado en git).
# El entrypoint del servicio alertmanager reemplaza los placeholders con las env vars
# TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID (definidas en Coolify / .env) al arrancar.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '__BOT_TOKEN__'
        chat_id: __CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: |
          {{ range .Alerts }}<b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          {{ end }}
