# Telegraf — métricas por contenedor (CPU / RAM / red / IO).
#
# Reemplaza a cAdvisor, que no funciona en este host: Docker 29.x usa el storage
# driver `overlayfs` y cAdvisor lo lee del filesystem para resolver los nombres de
# los containers (bug google/cadvisor#3860). Telegraf le pregunta a la API de Docker
# — el mismo dato que muestra `docker stats` — así que el bug no lo afecta.
#
# NO habla con /var/run/docker.sock directamente: va contra docker-socket-proxy,
# que solo permite GET/HEAD (POST=0). Telegraf no tiene acceso al socket real.

[agent]
  interval = "15s"
  flush_interval = "15s"
  round_interval = true
  omit_hostname = true

[[inputs.docker]]
  endpoint = "tcp://docker-socket-proxy:2375"
  gather_services = false
  container_state_include = ["running"]
  perdevice_include = ["cpu"]
  total_include = ["cpu", "blkio", "network"]
  # Coolify le pone decenas de labels a cada container; sin esto la cardinalidad
  # en Prometheus se dispara.
  docker_label_exclude = ["*"]
  timeout = "5s"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
